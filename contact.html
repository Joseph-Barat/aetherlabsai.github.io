    <script>
        gsap.registerPlugin(ScrollTrigger);

        // give the scrollable content a variable
        const scrollContent = document.querySelector("#scrollContent");

        gsap.set("[data-left]", { x: "-100%", autoAlpha: 0 }); // Set initial values
        gsap.set("[data-right]", { x: "100%", autoAlpha: 0 }); // Set initial values

        // Function to animate elements from the left
        function animateFromLeft(element) {
            gsap.to(element, {
                x: "0%", // end at original position
                autoAlpha: 1, // end at full opacity
                duration: 0.5, // duration of animation
                ease: "power1.out" // easing
            });
        }

        // Function to animate elements from the right
        function animateFromRight(element) {
            gsap.to(element, {
                x: "0%", // end at original position
                autoAlpha: 1, // end at full opacity
                duration: 0.5, // duration of animation
                ease: "power1.out" // easing
            });
        }

        // Select all elements with the data-left attribute and animate them
        document.querySelectorAll("[data-left]").forEach((element) => {
            ScrollTrigger.create({
                trigger: element,
                scroller: scrollContent, // use custom scroll container
                start: "top bottom", // start when element enters the viewport
                onEnter: () => animateFromLeft(element),
                onLeaveBack: () => gsap.to(element, { x: "-100%", autoAlpha: 0, duration: 0.2 }), // Reset when element leaves
            });
        });

        // Select all elements with the data-right attribute and animate them
        document.querySelectorAll("[data-right]").forEach((element) => {
            ScrollTrigger.create({
                trigger: element,
                scroller: scrollContent, // use custom scroll container
                start: "top bottom", // start when element enters the viewport
                onEnter: () => animateFromRight(element),
                onLeaveBack: () => gsap.to(element, { x: "100%", autoAlpha: 0, duration: 0.2 }), // Reset when element leaves
            });
        });



        window.addEventListener("sscroll", (e) => {
            ScrollTrigger.update();
        });

        // copy button function
        document.addEventListener("DOMContentLoaded", function () {
            let btnCopy2 = document.querySelector("[btn-copy-2]");

            btnCopy2.addEventListener("click", function () {
                copyText(".code2 pre", btnCopy2);
            });

            function copyText(selector, button) {
                let preCode = document.querySelector(selector).innerHTML;

                navigator.clipboard
                    .writeText(preCode)
                    .then(() => {
                        button.innerText = "Copied!";
                        setTimeout(() => {
                            button.innerText = "Copy";
                        }, 3000);
                    })
                    .catch((err) => console.error("Could not copy text: ", err));
            }
        });

<script>
    // ==== CONFIG ====
    const WEBHOOK_URL = 'https://hook.eu2.make.com/q5oqqsbmhjiyb5tl6ns7e5qys6qxu944';
    const REQUEST_TIMEOUT_MS = 15000;

    let turnstileToken = null;

    function onTurnstileSuccess(token) {
        turnstileToken = token;
    }

    function getExpectedDigits() {
        const countrySelect = document.getElementById('countryCodeSelect');
        const selectedOption = countrySelect?.options[countrySelect.selectedIndex];
        return parseInt(selectedOption?.getAttribute('data-digits'), 10) || 15;
    }

    function enforcePhoneDigitLimit() {
        const phoneInput = document.getElementById('Phone');
        if (!phoneInput) return;

        const maxDigits = getExpectedDigits();
        phoneInput.setAttribute('maxlength', maxDigits);

        let digitsOnly = phoneInput.value.replace(/\D/g, '');
        if (digitsOnly.length > maxDigits) {
            digitsOnly = digitsOnly.slice(0, maxDigits);
        }
        phoneInput.value = digitsOnly;
    }

    function updateFullPhoneNumber() {
        const countrySelect = document.getElementById('countryCodeSelect');
        const phoneInput = document.getElementById('Phone');
        const fullPhoneInput = document.getElementById('fullPhoneNumber');

        if (!countrySelect || !phoneInput || !fullPhoneInput) return;

        const selectedOption = countrySelect.options[countrySelect.selectedIndex];
        const countryCode = selectedOption?.value || '';
        const rawDigits = phoneInput.value.replace(/\D/g, '');

        if (countryCode && rawDigits) {
            fullPhoneInput.value = `+${countryCode}${rawDigits}`;
        } else {
            fullPhoneInput.value = '';
        }
    }

    async function handleFormSubmit(event) {
        event.preventDefault();
        event.stopImmediatePropagation();

        const form = event.target;
        const submitButton = form.querySelector('.submit-button-4');
        const originalButtonText = submitButton.value;
        const successMessage = document.querySelector('.success-message-3');
        const errorMessage = document.querySelector('.error-message-3');
        const phoneInput = document.getElementById('Phone');

        enforcePhoneDigitLimit();
        updateFullPhoneNumber();

        if (phoneInput && phoneInput.hasAttribute('required')) {
            const expectedDigits = getExpectedDigits();
            const actualDigits = phoneInput.value.replace(/\D/g, '').length;

            if (actualDigits !== expectedDigits) {
                errorMessage.style.display = 'block';
                successMessage.style.display = 'none';
                errorMessage.querySelector('.text-block-25').textContent =
                    `Please enter a valid phone number (${expectedDigits} digits expected for the selected country).`;
                errorMessage.scrollIntoView({ behavior: 'smooth' });
                return;
            }
        }

        const fullPhone = document.getElementById('fullPhoneNumber')?.value || '';
        if (phoneInput && fullPhone) {
            phoneInput.value = fullPhone;
        }

        try {
            submitButton.disabled = true;
            submitButton.value = 'Submitting...';

            const formData = new FormData(form);
            const payload = {};
            formData.forEach((value, key) => {
                payload[key] = value;
            });

            if (turnstileToken) {
                payload['cf-turnstile-response'] = turnstileToken;
            }

            const controller = new AbortController();
            const timeoutId = setTimeout(() => controller.abort(), REQUEST_TIMEOUT_MS);

            const response = await fetch(WEBHOOK_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload),
                signal: controller.signal
            });

            clearTimeout(timeoutId);

            if (response.status < 400) {
                form.style.display = 'none';
                successMessage.style.display = 'block';
                errorMessage.style.display = 'none';
                successMessage.scrollIntoView({ behavior: 'smooth' });
            } else {
                throw new Error(`HTTP error! status: ${response.status}`);
            }
        } catch (error) {
            console.error('Form submission error:', error.name === 'AbortError' ? 'Request timed out' : error);
            errorMessage.style.display = 'block';
            successMessage.style.display = 'none';
        } finally {
            submitButton.disabled = false;
            submitButton.value = originalButtonText;
        }
    }

    document.addEventListener('DOMContentLoaded', function() {
        const form = document.getElementById('email-form');
        const phoneInput = document.getElementById('Phone');
        const countrySelect = document.getElementById('countryCodeSelect');

        if (phoneInput) {
            phoneInput.addEventListener('input', function() {
                enforcePhoneDigitLimit();
                updateFullPhoneNumber();
            });
        }

        if (countrySelect) {
            countrySelect.addEventListener('change', function() {
                enforcePhoneDigitLimit();
                updateFullPhoneNumber();
            });
            enforcePhoneDigitLimit();
        }

        if (form) {
            form.removeEventListener('submit', handleFormSubmit);
            form.addEventListener('submit', handleFormSubmit);
        }
    });
</script>
